name: Tests and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Normalize Windows temporary directory
        shell: pwsh
        run: |
          $temporaryPath = node -e "process.stdout.write(require('node:fs').realpathSync.native(require('node:os').tmpdir()))"
          "TEMP=$temporaryPath" >> $env:GITHUB_ENV
          "TMP=$temporaryPath" >> $env:GITHUB_ENV
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        id: python
        with:
          python-version: '3.12'
      - name: Prepare speech worker tests
        run: python -m pip install --disable-pip-version-check numpy==2.2.6
      - run: npm ci
      - run: npm test
        env:
          SAS_TTS_PYTHON: ${{ steps.python.outputs.python-path }}
      - run: npm run build
